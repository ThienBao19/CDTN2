# Cổng vào duy nhất: /api -> API (NestJS), còn lại -> web (Next.js)
upstream api_upstream { server api:4000; keepalive 64; }
upstream web_upstream { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  # Kênh realtime SSE: tắt đệm và giữ kết nối lâu
  location = /api/events {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Ghi IP thật của người dùng; API tin đúng 1 tầng proxy (TRUST_PROXY=1)
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
